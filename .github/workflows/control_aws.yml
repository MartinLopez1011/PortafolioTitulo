name: Control Servidor AWS (Ahorro de Costos)

on:
  workflow_dispatch:
    inputs:
      accion:
        description: "Acción sobre el servidor EC2 (y RDS si existe)"
        type: choice
        options:
          - estado
          - iniciar
          - detener
        default: estado

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
  EC2_TAG: qla-servidor
  RDS_ID: qla-mantpred
  API_NAME: qla-dashboard
  LAMBDA_FUNCTION: qla-molino-inferencia

jobs:
  control:
    name: "${{ inputs.accion }} servidor AWS"
    runs-on: ubuntu-latest
    steps:
      - name: Credenciales AWS (OIDC)
        if: vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Credenciales AWS (Secrets IAM / STS)
        if: vars.AWS_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ejecutar acción (${{ inputs.accion }})
        run: |
          set -euo pipefail
          IID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$EC2_TAG" "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          RDS_STATUS=$(aws rds describe-db-instances --db-instance-identifier "$RDS_ID" \
            --query "DBInstances[0].DBInstanceStatus" --output text 2>/dev/null || echo "no-existe")
          LAMBDA_STATE=$(aws lambda get-function-configuration --function-name "$LAMBDA_FUNCTION" \
            --query "State" --output text 2>/dev/null || echo "no-existe")

          if [ -z "$IID" ] || [ "$IID" = "None" ]; then
            {
              echo "### Estado del Entorno AWS ($AWS_REGION)"
              echo "| Recurso | Estado |"
              echo "|---|---|"
              echo "| **EC2 ($EC2_TAG)** | **No creada aún** (se creará automáticamente al ejecutar *CD Despliegue Manual*) |"
              echo "| **Lambda ($LAMBDA_FUNCTION)** | \`$LAMBDA_STATE\` |"
              echo "| **RDS ($RDS_ID)** | \`$RDS_STATUS\` |"
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "${{ inputs.accion }}" != "estado" ]; then
              echo "::warning::La instancia EC2 $EC2_TAG aún no existe. Ejecuta primero el workflow 'CD (Despliegue Manual a AWS)'."
            fi
            exit 0
          fi

          case "${{ inputs.accion }}" in
            iniciar)
              if [ "$RDS_STATUS" = "stopped" ]; then
                echo "Encendiendo RDS $RDS_ID..."
                aws rds start-db-instance --db-instance-identifier "$RDS_ID" >/dev/null || true
              fi
              echo "Encendiendo EC2 $IID..."
              aws ec2 start-instances --instance-ids "$IID" >/dev/null
              aws ec2 wait instance-running --instance-ids "$IID"
              PUBLIC_IP=$(aws ec2 describe-instances --instance-ids "$IID" --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
              API_ID=$(aws apigatewayv2 get-apis --query "Items[?Name=='$API_NAME'].ApiId | [0]" --output text)
              if [ -n "$API_ID" ] && [ "$API_ID" != "None" ]; then
                for IID_INT in $(aws apigatewayv2 get-integrations --api-id "$API_ID" --query "Items[].IntegrationId" --output text); do
                  URI=$(aws apigatewayv2 get-integration --api-id "$API_ID" --integration-id "$IID_INT" --query IntegrationUri --output text)
                  if echo "$URI" | grep -q "{proxy}"; then
                    aws apigatewayv2 update-integration --api-id "$API_ID" --integration-id "$IID_INT" --integration-uri "http://$PUBLIC_IP/{proxy}" >/dev/null
                  else
                    aws apigatewayv2 update-integration --api-id "$API_ID" --integration-id "$IID_INT" --integration-uri "http://$PUBLIC_IP/" >/dev/null
                  fi
                done
              fi
              ;;
            detener)
              echo "Deteniendo EC2 $IID (deja de cobrar cómputo por hora)..."
              aws ec2 stop-instances --instance-ids "$IID" >/dev/null
              aws ec2 wait instance-stopped --instance-ids "$IID"
              if [ "$RDS_STATUS" = "available" ]; then
                echo "Deteniendo RDS $RDS_ID..."
                aws rds stop-db-instance --db-instance-identifier "$RDS_ID" >/dev/null || true
              fi
              ;;
          esac

          EC2_STATE=$(aws ec2 describe-instances --instance-ids "$IID" --query "Reservations[0].Instances[0].State.Name" --output text)
          IP=$(aws ec2 describe-instances --instance-ids "$IID" --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          API_ID=$(aws apigatewayv2 get-apis --query "Items[?Name=='$API_NAME'].ApiId | [0]" --output text)
          URL="https://${API_ID}.execute-api.${AWS_REGION}.amazonaws.com"

          {
            echo "### Estado del Entorno AWS ($AWS_REGION)"
            echo "| Recurso | Valor |"
            echo "|---|---|"
            echo "| **EC2 ($EC2_TAG)** | \`$IID\` — **$EC2_STATE** (IP: \`$IP\`) |"
            echo "| **Lambda ($LAMBDA_FUNCTION)** | \`$LAMBDA_STATE\` |"
            echo "| **RDS ($RDS_ID)** | \`$RDS_STATUS\` |"
            if [ -n "$API_ID" ] && [ "$API_ID" != "None" ]; then
              echo "| **URL Dashboard HTTPS** | $URL |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
